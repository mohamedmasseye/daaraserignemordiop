workflows:
  ios-appstore:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Configurer dans : Codemagic → Teams → Integrations → App Store Connect
    integrations:
      app_store_connect: App Store Connect API

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daara.app
      node: 22
      xcode: latest
      # Ajouter dans Codemagic → projet → Environment variables :
      # GOOGLESERVICE_INFO_PLIST  (type: fichier, valeur: contenu base64 du GoogleService-Info.plist)
      vars:
        BUNDLE_ID: "com.daara.app"

    scripts:
      - name: Install Dependencies
        script: |
          cd daara-web
          npm install --legacy-peer-deps

      - name: Web Build
        script: |
          cd daara-web
          npm run build

      - name: Capacitor Sync iOS
        # ✅ On ne supprime plus ios/ — le projet est déjà configuré dans git
        # npx cap sync met juste à jour les assets web sans toucher aux fichiers natifs
        script: |
          cd daara-web
          npx cap sync ios

      - name: Injecter GoogleService-Info.plist
        # ✅ Ce fichier contient des clés privées → jamais dans git
        # Stocker son contenu (base64) dans la variable GOOGLESERVICE_INFO_PLIST dans Codemagic
        script: |
          echo $GOOGLESERVICE_INFO_PLIST | base64 --decode > daara-web/ios/App/App/GoogleService-Info.plist

      - name: Ajouter PrivacyInfo.xcprivacy au projet Xcode
        # ✅ Obligatoire depuis iOS 17 pour App Store
        script: |
          gem install xcodeproj --quiet
          ruby << 'RUBY'
          require 'xcodeproj'
          project_path = 'daara-web/ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' }
          privacy_file_path = 'daara-web/ios/App/App/PrivacyInfo.xcprivacy'
          already_added = project.files.any? { |f| f.path.include?('PrivacyInfo.xcprivacy') }
          unless already_added
            file_ref = project.new_file(File.expand_path(privacy_file_path))
            target.resources_build_phase.add_file_reference(file_ref)
            project.save
            puts "PrivacyInfo.xcprivacy ajouté au projet"
          else
            puts "PrivacyInfo.xcprivacy déjà présent"
          end
          RUBY

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd daara-web/ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA
        script: |
          cd daara-web/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - daara-web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - mohamed.masseye@gmail.com
        notify:
          success: true
          failure: true
